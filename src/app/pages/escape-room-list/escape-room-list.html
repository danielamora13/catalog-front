<section class="list-page">
  <header class="list-header">
    <div>
      <p class="eyebrow">Inventory</p>
      <h2>Escape Rooms</h2>
    </div>
    <a class="primary-button" [routerLink]="['/home/escape-room-create']">New room</a>
  </header>

  @if (escapeRooms.length) {
    <div class="card-grid">
      @for (room of escapeRooms; track room.id) {
        <article class="room-card" [routerLink]="['/home/escape-room-detail', room.id]">
          <img [src]="getPhotoUrl(room.photo)" [alt]="room.name" />

          <div class="card-body">
            <div class="card-top">
              <h3>{{ room.name }}</h3>
              <span class="city-tag">{{ room.city }}</span>
            </div>

            <p class="date-text">{{ room.date | date: 'dd MMM yyyy' }}</p>
            <p class="description">{{ room.description }}</p>
          </div>
        </article>
      }
    </div>
  } @else {
    <div class="empty-state">
      <h3>No escape rooms found</h3>
      <p>There are no rooms available right now.</p>
    </div>
  }
</section>
