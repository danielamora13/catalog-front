@if (isLoading) {
	<p>Loading escape room...</p>
} @else if (loadError) {
	<section class="empty-state">
		<h2>Escape room not found</h2>
		<a routerLink="/home/escape-room-list">Back to rooms</a>
	</section>
} @else {
	<section class="update-page">
		<header class="page-header">
			<div>
				<p class="eyebrow">Inventory</p>
				<h2>Edit escape room</h2>
			</div>
			<a routerLink="/home/escape-room-list">Back to rooms</a>
		</header>

		<form class="room-form" [formGroup]="escapeRoomForm" (ngSubmit)="submit()">
			<label>
				Name
				<input type="text" formControlName="name" />
				@if (escapeRoomForm.controls['name'].touched && escapeRoomForm.controls['name'].invalid) {
					<span class="field-error">Name is required.</span>
				}
			</label>
			<label>
				Date
				<input type="date" formControlName="date" />
				@if (escapeRoomForm.controls['date'].touched && escapeRoomForm.controls['date'].invalid) {
					<span class="field-error">Date is required.</span>
				}
			</label>
			<label>
				City
				<input type="text" formControlName="city" />
				@if (escapeRoomForm.controls['city'].touched && escapeRoomForm.controls['city'].invalid) {
					<span class="field-error">City is required.</span>
				}
			</label>
			<label>
				Photo URL <span class="optional">(optional)</span>
				<input type="url" formControlName="photo" />
			</label>
			<label class="full-width">
				Description
				<textarea rows="5" formControlName="description"></textarea>
				@if (escapeRoomForm.controls['description'].touched && escapeRoomForm.controls['description'].invalid) {
					<span class="field-error">Description is required.</span>
				}
			</label>
			<label class="full-width">
				Synopsis <span class="optional">(optional)</span>
				<textarea rows="4" formControlName="synopsis"></textarea>
			</label>
			<label>
				Number of people <span class="optional">(optional)</span>
				<input type="number" min="0" formControlName="numPeople" />
			</label>
			<label>
				Difficulty <span class="optional">(optional)</span>
				<input type="text" formControlName="difficulty" />
			</label>
			<label>
				Time (minutes) <span class="optional">(optional)</span>
				<input type="number" min="0" formControlName="time" />
			</label>
			@if (submitError) {
				<p class="submit-error full-width">{{ submitError }}</p>
			}
			<div class="form-actions full-width">
				<a routerLink="/home/escape-room-list">Cancel</a>
				<button class="primary-button" type="submit" [disabled]="isSubmitting">
					{{ isSubmitting ? 'Saving...' : 'Save changes' }}
				</button>
			</div>
		</form>
	</section>
}
